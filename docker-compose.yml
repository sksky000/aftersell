name: aftersell

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: aftersell
      POSTGRES_USER: aftersell
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aftersell -d aftersell']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: &logging
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'

  redis:
    image: redis:7-alpine
    restart: always
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  app:
    build: .
    image: aftersell-app:latest
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgres://aftersell:${POSTGRES_PASSWORD}@postgres:5432/aftersell
      REDIS_URL: redis://redis:6379
    volumes:
      - ./data/attachments:/app/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_HOST: ${SITE_HOST:?请在 .env 中设置 SITE_HOST}
      TLS_ISSUER: ${TLS_ISSUER:-internal}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - app
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddydata:
